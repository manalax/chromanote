bundle:
  name: chromanote

variables:
  images_volume:
    description: Unity Catalog volume (catalog.schema.volume) that stores note images.
    default: workspace.chromanote.images
  chat_endpoint:
    description: Model Serving chat endpoint used by the assistant.
    default: databricks-gpt-oss-120b
  embedding_endpoint:
    description: Model Serving embedding endpoint (must return 1024-dim vectors).
    default: databricks-gte-large-en
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

resources:
  apps:
    app:
      name: "chromanote"
      description: "Chromanote: a colourful knowledge base with a RAG assistant"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, dashboards.genie, files.files, serving.serving-endpoints
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: images
          uc_securable:
            securable_full_name: ${var.images_volume}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: chat-endpoint
          serving_endpoint:
            name: ${var.chat_endpoint}
            permission: CAN_QUERY
        - name: embedding-endpoint
          serving_endpoint:
            name: ${var.embedding_endpoint}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://dbc-9d7c6d6a-e0ae.cloud.databricks.com

    variables:
      postgres_project: projects/chromanote
      postgres_branch: projects/chromanote/branches/production
      postgres_database: projects/chromanote/branches/production/databases/databricks-postgres
